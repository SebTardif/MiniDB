name: Links

# Pull requests warn and still report Check Links success. A weekly run
# and a push to main fail the job when a durable doc link is broken.
# pull_request has no path filter: Check Links is a required check, and a
# skipped workflow would leave the pull blocked.

on:
  push:
    branches: [main]
    paths:
      - "**/*.md"
      - "lychee.toml"
      - ".github/workflows/links.yml"
  pull_request:
    branches: [main]
  schedule:
    - cron: "17 12 * * 1"
  workflow_dispatch: {}

concurrency:
  group: links-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    if: github.event_name == 'pull_request'
    permissions:
      pull-requests: read
    outputs:
      docs: ${{ steps.filter.outputs.docs }}
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d # v4.0.3
        id: filter
        with:
          filters: |
            docs:
              - '**/*.md'
              - 'lychee.toml'
              - '.github/workflows/links.yml'

  links-run:
    name: Links Run
    needs: [changes]
    if: always() && (needs.changes.result == 'skipped' || needs.changes.outputs.docs == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Check links
        uses: lycheeverse/lychee-action@e7477775783ea5526144ba13e8db5eec57747ce8 # v2.9.0
        with:
          args: --no-progress --config lychee.toml '**/*.md'
          fail: ${{ github.event_name != 'pull_request' }}

  check-links:
    name: Check Links
    needs: [links-run]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Gate
        env:
          RESULT: ${{ needs.links-run.result }}
          EVENT: ${{ github.event_name }}
        run: |
          set -euo pipefail
          echo "links-run result: $RESULT (event=$EVENT)"
          if [ "$RESULT" = "skipped" ] || [ "$RESULT" = "success" ]; then
            echo "Check Links: OK ($RESULT)"
            exit 0
          fi
          if [ "$EVENT" = "pull_request" ]; then
            echo "::warning::Link check $RESULT on a pull request. Main and the weekly run still fail."
            exit 0
          fi
          echo "Link check failed or was cancelled"
          exit 1

  report-failure:
    name: Report link check failure
    needs: [links-run]
    if: always() && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      issues: write
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Open or close the failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          ASSIGNEE: ${{ vars.NIGHTLY_FAILURE_ASSIGNEE || 'SebTardif' }}
          RUN_ID: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_RESULTS: links=${{ needs.links-run.result }}
        run: |
          python3 scripts/report-scheduled-failure.py \
            --prefix "Links red" \
            --run-id "$RUN_ID" \
            --run-url "$RUN_URL" \
            --label nightly-failure \
            --label ready
