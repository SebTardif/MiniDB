name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Recipe A/E: do not re-run the product test matrix on every main push.
  # PR CI already tested the tree. This job is release-please-equivalent
  # (python-semantic-release) plus one trusted publish compile.
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.repository_owner == 'sebtardif'
    permissions:
      contents: write
      id-token: write
      pull-requests: write

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          fetch-tags: true
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: ./.github/actions/setup-python
        with:
          python-version: "3.13"

      # main requires a pull request. Commit locally, then open
      # chore/release-<version>. Tag and publish only after that merges.
      # The v10 action errors with "commit_sha" unset when push and tag
      # are false, so the CLI commits locally and this job opens the PR.
      - name: Python Semantic Release
        id: release
        if: github.event_name != 'push' || !startsWith(github.event.head_commit.message || '', 'chore(release):')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          pip install "python-semantic-release==10.7.0"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          before="$(git rev-parse HEAD)"
          semantic-release -v version --commit --no-tag --no-push --no-vcs-release --skip-build
          after="$(git rev-parse HEAD)"
          version="$(python3 -c 'import tomllib; from pathlib import Path; print(tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])')"
          if [ "$before" != "$after" ]; then
            echo "released=true" >> "$GITHUB_OUTPUT"
          else
            echo "released=false" >> "$GITHUB_OUTPUT"
          fi
          echo "version=${version}" >> "$GITHUB_OUTPUT"

      - name: Open release pull request
        if: steps.release.outputs.released == 'true'
        env:
          VERSION: ${{ steps.release.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/open-release-pr.sh

      - name: Publish GitHub Release
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message || '', 'chore(release):')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: bash scripts/publish-merged-release.sh

      - name: Build package
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message || '', 'chore(release):')
        run: pip install build && python -m build

      - name: Publish to PyPI
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message || '', 'chore(release):')
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # v1.14.0
        continue-on-error: true
        with:
          skip-existing: true

      - name: Apply curated release notes
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message || '', 'chore(release):')
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_NOTES: ${{ vars.RELEASE_NOTES }}
          RELEASE_NOTES_TAG: ${{ vars.RELEASE_NOTES_TAG }}
        run: |
          version="$(python3 -c 'import tomllib; from pathlib import Path; print(tomllib.loads(Path("pyproject.toml").read_text(encoding="utf-8"))["project"]["version"])')"
          TAG="v${version}" bash scripts/apply-release-notes.sh
