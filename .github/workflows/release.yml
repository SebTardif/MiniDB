name: Release

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # Recipe A/E: do not re-run the product test matrix on every main push.
  # PR CI already tested the tree. This job is release-please-equivalent
  # (python-semantic-release) plus one trusted publish compile.
  release:
    name: Semantic Release
    runs-on: ubuntu-latest
    timeout-minutes: 15
    if: github.repository_owner == 'sebtardif'
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Harden runner
        uses: step-security/harden-runner@e14015d583714f6e62063499dc959a02595150a1 # v2.21.1
        with:
          egress-policy: audit

      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Python Semantic Release
        id: release
        uses: python-semantic-release/python-semantic-release@v10
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish to GitHub Releases
        if: steps.release.outputs.released == 'true'
        uses: python-semantic-release/publish-action@v10
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}

      - name: Build package
        if: steps.release.outputs.released == 'true'
        run: pip install build && python -m build

      - name: Publish to PyPI
        if: steps.release.outputs.released == 'true'
        uses: pypa/gh-action-pypi-publish@release/v1
        continue-on-error: true
        with:
          skip-existing: true

      - name: Apply curated release notes
        if: steps.release.outputs.released == 'true'
        continue-on-error: true
        env:
          TAG: ${{ steps.release.outputs.tag }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RELEASE_NOTES: ${{ vars.RELEASE_NOTES }}
          RELEASE_NOTES_TAG: ${{ vars.RELEASE_NOTES_TAG }}
        run: bash scripts/apply-release-notes.sh
