name: Auto-approve

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: auto-approve-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  auto-approve:
    name: Auto-approve
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write
    # Approve only. This repo has no GitHub App, and a GITHUB_TOKEN
    # squash would skip the Release workflow on main.
    if: >-
      github.event_name == 'pull_request' &&
      github.event.pull_request.head.repo.full_name == github.repository &&
      github.event.pull_request.user.login != 'dependabot[bot]' &&
      github.event.pull_request.user.login != 'github-actions[bot]' &&
      (github.actor == 'SebTardif' || github.actor == 'minidb-release[bot]')
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@1d88384fd173af6ecb012dfd0264a306b711241a # v2.22.4
        with:
          egress-policy: audit

      - name: Approve pull request
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_URL: ${{ github.event.pull_request.html_url }}
        run: |
          set -euo pipefail
          if gh pr review --approve "$PR_URL"; then
            echo "Approved"
            exit 0
          fi
          echo "Approve returned non-zero; checking for an existing approval"
          count=$(gh pr view "$PR_URL" --json reviews --jq '[.reviews[] | select(.state=="APPROVED")] | length')
          echo "existing approvals=${count}"
          if [ "$count" = "0" ]; then
            echo "Pull request has no approving review"
            exit 1
          fi
