name: CI

on:
  # Recipe A: product tests on PR (and merge_group if a queue is added).
  # Do not compile again on push to main. Release publish stays in release.yml.
  pull_request:
    branches: [main]
  merge_group: {}
  workflow_dispatch: {}

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  lint:
    name: Lint & Format
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-python
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install ruff==0.16.6

      - name: Ruff check
        run: ruff check .

      - name: Ruff format check
        run: ruff format --check .
      - name: Lock Recipe A and notes-branch apply
        run: |
          python3 scripts/test_apply_release_notes.py
          python3 scripts/test_workflow_triggers.py
          python3 scripts/test_check_dco.py
          python3 scripts/test_report_scheduled_failure.py

  type-check:
    name: Type Check
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-python
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: pip install mypy

      - name: Mypy
        run: mypy minidb/

  test:
    name: Test (Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: ./.github/actions/setup-python
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install dependencies
        run: pip install pytest pytest-cov

      - name: Run tests with coverage
        run: pytest tests/ --cov=minidb --cov-report=term-missing --cov-report=xml

      - name: Upload coverage
        if: matrix.python-version == '3.13'
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7
        with:
          name: coverage-report
          path: coverage.xml

  workflow-sanity:
    name: Workflow sanity
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install actionlint
        run: |
          set -euo pipefail
          archive="actionlint_1.7.12_linux_amd64.tar.gz"
          sha="8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
          curl -sSfL "https://github.com/rhysd/actionlint/releases/download/v1.7.12/${archive}" \
            -o "/tmp/${archive}"
          echo "${sha}  /tmp/${archive}" | sha256sum -c -
          sudo tar -xzf "/tmp/${archive}" -C /usr/local/bin actionlint
          actionlint -version

      - name: Install zizmor
        uses: taiki-e/install-action@5488ac5a951645ce95062214902ac4b6bc1a1037 # v2.87.32
        with:
          tool: zizmor@1.30.0

      - name: actionlint
        run: actionlint -color

      - name: zizmor
        run: zizmor --persona=regular --min-severity=medium .github/workflows .github/actions

  ci:
    name: ci
    needs: [lint, type-check, test, workflow-sanity]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Harden runner
        uses: step-security/harden-runner@46b06cea07f9e64621fdf066ba77ac6915163d43 # v2.22.3
        with:
          egress-policy: audit

      - name: Gate
        env:
          LINT: ${{ needs.lint.result }}
          TYPE: ${{ needs.type-check.result }}
          TEST: ${{ needs.test.result }}
          SANITY: ${{ needs.workflow-sanity.result }}
        run: |
          set -euo pipefail
          for result in "$LINT" "$TYPE" "$TEST" "$SANITY"; do
            if [ "$result" != "success" ]; then
              echo "Upstream job did not succeed: $result"
              exit 1
            fi
          done
          echo "ci gate passed"
